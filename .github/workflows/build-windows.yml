name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Windows 工程
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows --project-name video_scraper .
            if ($LASTEXITCODE -ne 0) {
              throw "Windows 工程生成失败"
            }
          }

          if (-not (Test-Path "windows/CMakeLists.txt")) {
            throw "未找到 windows/CMakeLists.txt"
          }

      - name: 修复 MSVC 协程兼容性
        shell: pwsh
        run: |
          $path = "windows/CMakeLists.txt"
          $content = Get-Content $path -Raw

          $macro = "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"

          if ($content -notmatch [regex]::Escape("_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS")) {
            $pattern = '(?m)^include\(flutter/generated_plugins\.cmake\)'
            if ($content -notmatch $pattern) {
              throw "找不到 generated_plugins.cmake，请检查 Windows 工程模板"
            }

            $content = [regex]::Replace(
              $content,
              $pattern,
              "$macro`r`ninclude(flutter/generated_plugins.cmake)",
              1
            )

            Set-Content -Path $path -Value $content -Encoding utf8
          }

          Write-Host "已配置 MSVC 协程兼容宏"

      - name: 修改窗口标题
        shell: pwsh
        run: |
          $path = "windows/runner/main.cpp"
          if (-not (Test-Path $path)) {
            throw "找不到 $path"
          }

          $content = Get-Content $path -Raw
          $old = 'L"video_scraper"'
          $new = 'L"\u5F71\u7247\u522E\u524A\u5668"'

          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            Set-Content -Path $path -Value $content -Encoding utf8
          }
          elseif (-not $content.Contains($new)) {
            Write-Warning "未找到预期标题，保留工程默认标题"
          }

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 Windows 正式版
        run: flutter build windows --release

      - name: 检查编译输出
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$dst/video_scraper.exe")) {
            Get-ChildItem $dst -ErrorAction SilentlyContinue
            throw "未找到 video_scraper.exe，请检查编译输出"
          }

          Get-ChildItem $dst | Select-Object Name, Length

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: video-scraper-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
