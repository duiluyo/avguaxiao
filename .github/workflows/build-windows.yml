name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 补全 Windows 工程文件（如果缺失）
        shell: bash
        run: |
          if [ ! -d "windows" ]; then
            flutter create --platforms=windows --project-name video_scraper .
          fi

      - name: 窗口标题改成「影片刮削器」
        shell: bash
        run: |
          python - <<'EOF'
          path = 'windows/runner/main.cpp'
          s = open(path, encoding='utf-8').read()
          title = '影片刮削器'
          esc = ''.join('\\u%04X' % ord(c) for c in title)
          if 'L"video_scraper"' in s:
              s = s.replace('L"video_scraper"', 'L"' + esc + '"')
              open(path, 'w', encoding='utf-8').write(s)
              print('窗口标题已修改')
          else:
              print('::warning::没找到窗口标题，保持默认')
          EOF

      - name: 安装依赖
        run: flutter pub get

      - name: 打包 Windows 程序
        run: flutter build windows --release

      - name: 附带 VC++ 运行库（电脑没装也能运行）
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$f" $dst -ErrorAction SilentlyContinue
          }
          Get-ChildItem $dst | Select-Object Name, Length

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: video-scraper-windows
          path: build/windows/x64/runner/Release
